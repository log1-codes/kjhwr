services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: wind-backend:latest
    container_name: wind-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATA_DIR=/app/data
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:80,http://127.0.0.1:3000,http://localhost
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: wind-frontend:latest
    container_name: wind-frontend
    ports:
      - "3000:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
